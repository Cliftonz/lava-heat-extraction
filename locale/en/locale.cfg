[entity-description]
lava-heating-tower=A specialized heating tower that burns filtered lava to generate heat extremely quickly. Built with heat-resistant tungsten components. Filter lava in a foundry first via lava sluicing. Operates at 250% efficiency like standard heating towers.

[item-description]
lava-heating-tower=A specialized heating tower that burns filtered lava to generate heat extremely quickly. Built with heat-resistant tungsten components. Filter lava in a foundry first via lava sluicing.

[mod-description]
lava-heating-tower=Adds a lava-powered heating tower fueled by filtered lava from a new foundry sluicing recipe (stone byproduct), and modifies acid neutralization to produce cold steam (125°C). Unlocks with Tungsten carbide research.

